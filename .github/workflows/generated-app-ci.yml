name: Generated app CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generated-app:
    name: 생성 앱 CI (${{ matrix.template }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - template: apps-in-toss
            targets: apps-in-toss
          - template: all
            targets: apps-in-toss,android,ios,web
    env:
      APP_DIR: ${{ github.workspace }}/build/generated-app
      CLI_DIR: ${{ github.workspace }}/build/generated-cli
      CLI_ARCHIVE: ${{ github.workspace }}/build/create-ait-cmp-app.tgz
      APP_TARGETS: ${{ matrix.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: true
      - name: Yarn 4 설치
        run: corepack enable
      - name: SDK 저장소 의존성 설치
        run: yarn install --immutable
      - name: 배포용 CLI 패키지에서 앱 생성
        run: |
          mkdir -p "$CLI_DIR"
          yarn workspace create-ait-cmp-app pack --out "$CLI_ARCHIVE"
          tar -xzf "$CLI_ARCHIVE" -C "$CLI_DIR"
          node "$CLI_DIR/package/cli.js" "$APP_DIR" --yes \
            --package io.example.generated --app-name generated-app \
            --display-name '생성 앱 CI' --targets "$APP_TARGETS"
      - name: 생성 앱 워크플로 복원 확인
        run: |
          test -f "$APP_DIR/.github/workflows/ci.yml"
          test ! -d "$APP_DIR/_github"
          cmp packages/create-ait-cmp-app/templates/app/_github/workflows/ci.yml "$APP_DIR/.github/workflows/ci.yml"
      - name: 생성 앱 JS·TS 린트
        working-directory: ${{ env.APP_DIR }}
        run: yarn lint:js
      - name: 생성 앱 Kotlin·Gradle 린트
        working-directory: ${{ env.APP_DIR }}
        run: ./gradlew ktlintCheck --no-daemon --console=plain
      - name: 생성 앱 Kotlin JVM 테스트
        working-directory: ${{ env.APP_DIR }}
        run: ./gradlew :shared-core:jvmTest --no-daemon --console=plain
      - name: SDK 내부 JS 리소스 연결 확인
        working-directory: ${{ env.APP_DIR }}
        run: |
          ./gradlew :appsInTossApp:prepareAppsInTossBridge --no-daemon --console=plain
          for file in core index mock; do
            cmp "$GITHUB_WORKSPACE/sdk/src/webMain/resources/ait-cmp-bridge/$file.mjs" "appsInTossApp/build/ait-cmp-sdk/ait-cmp-bridge/$file.mjs"
          done
          node --input-type=module -e 'import assert from "node:assert/strict"; import fs from "node:fs"; const pkg=JSON.parse(fs.readFileSync("package.json")); assert.deepEqual(Object.keys(pkg.dependencies), ["@apps-in-toss/web-framework"]); assert.equal(fs.existsSync("vendor/npm"), false);'
