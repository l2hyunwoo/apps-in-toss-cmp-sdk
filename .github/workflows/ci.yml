name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    name: JS 린트·테스트
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Yarn 4 설치
        run: corepack enable
      - name: 의존성 설치
        run: yarn install --immutable
      - name: JS·TS 린트
        run: yarn lint:js
      - name: JS 테스트
        run: yarn test

  kotlin:
    name: Kotlin 린트·테스트
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Kotlin·Gradle 린트
        run: ./gradlew ktlintCheck --no-daemon --console=plain
      - name: Kotlin JVM 테스트
        run: ./gradlew :sdk:jvmTest :sample:shared-core:jvmTest --no-daemon --console=plain
      - name: Kotlin JS·Wasm 컴파일 및 ABI 검사
        run: ./gradlew :sdk:compileKotlinJs :sdk:compileKotlinWasmJs :sdk:checkKotlinAbi --no-daemon --console=plain
